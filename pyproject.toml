[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyloop"
version = "0.1.0"
description = "Embodied Drosophila sensorimotor loop driven by a connectome-derived LIF brain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Connectome access and the published columnar (retinotopy) tables.
# connectome-interpreter bundles the Nern 2024 and Matsliah 2024 hex-column
# tables; it pulls in torch, so this extra is heavy for the size of the data.
data = ["connectome-interpreter>=2.9", "neuprint-python>=0.4", "pyarrow>=14"]
# GPU brain backend.
gpu = ["torch>=2.1"]
# Biomechanical body (stage 4). NOTE: flygym 2.x requires Python >= 3.12.
body = ["flygym>=2.1", "mujoco>=3.9"]
# Connectome-constrained optic lobe. NOTE: flyvis requires Python < 3.13.
vision = ["flyvis>=1.2"]
dev = ["pytest>=7", "pyarrow>=14"]

# Python version window, because the two upstream models disagree:
#   flygym >= 2.1  needs Python >= 3.12
#   flyvis 1.2     needs Python <  3.13
# so a full install (body + vision) must run on Python 3.12 exactly. The core
# package and everything tested in CI works from 3.10 up.

[project.scripts]
flyloop = "flyloop.cli:main"

[tool.setuptools.packages.find]
include = ["flyloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
# The remaining default-off rules flag int() casts on numpy scalars, which are
# deliberate: they turn np.int64 into a plain int for JSON and for printing.
select = ["E", "F", "I", "W", "B"]
