[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyloop"
version = "0.1.0"
description = "Embodied Drosophila sensorimotor loop driven by a connectome-derived LIF brain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Real connectome downloads. Needs network access to neuprint.janelia.org.
data = ["neuprint-python>=0.4", "pyarrow>=14"]
# GPU brain backend.
gpu = ["torch>=2.1"]
# Biomechanical body (stage 4). Pulls in MuJoCo.
body = ["flygym>=1.0", "mujoco>=3.0"]
dev = ["pytest>=7", "pyarrow>=14"]

[project.scripts]
flyloop = "flyloop.cli:main"

[tool.setuptools.packages.find]
include = ["flyloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96

[tool.ruff.lint]
# The remaining default-off rules flag int() casts on numpy scalars, which are
# deliberate: they turn np.int64 into a plain int for JSON and for printing.
select = ["E", "F", "I", "W", "B"]
